<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>J.A.R.V.I.S — Enterprise Assistant</title>
  <link rel="manifest" href="/face/manifest.json">
  <link rel="icon" type="image/jpeg" href="/favicon.jpg">
  <style>
    :root {
      --bg: #030712;
      --panel: rgba(15, 23, 42, 0.92);
      --border: rgba(56, 189, 248, 0.25);
      --accent: #38bdf8;
      --green: #10b981;
      --red: #ef4444;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 35% 40%, #0f172a 0%, #030712 100%);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    .app-shell { display: grid; grid-template-columns: 1fr 390px; width: 100%; height: 100dvh; position: relative; }
    .stage { position: relative; height: 100%; overflow: hidden; }
    #canvas-container { position: absolute; inset: 0; z-index: 10; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    /* HIDE SCROLLBARS WHILE KEEPING SMOOTH TOUCH/WHEEL SCROLL */
    .chat-messages, .pane-body, #live-subtitle, .quick-chips {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .chat-messages::-webkit-scrollbar,
    .pane-body::-webkit-scrollbar,
    #live-subtitle::-webkit-scrollbar,
    .quick-chips::-webkit-scrollbar {
      display: none;
    }

    /* TOP BAR */
    #top-bar {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px; background: var(--panel);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 7px 14px; border-radius: 999px; z-index: 100;
      max-width: calc(100% - 24px); flex-wrap: wrap; justify-content: center;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55);
    }
    .hud-btn {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
      color: var(--text); padding: 6px 11px; border-radius: 999px; font-size: 12px;
      font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 5px;
      white-space: nowrap;
    }
    .hud-btn:hover { border-color: var(--accent); color: var(--accent); }
    .hud-btn.active { background: #0284c7; border-color: var(--accent); color: #fff; box-shadow: 0 0 14px rgba(56,189,248,0.5); }
    #btn-audio-call.active { background: rgba(16,185,129,0.88); border-color: #6ee7b7; }
    #btn-video-call.active { background: rgba(168,85,247,0.88); border-color: #d8b4fe; }
    .hud-btn.danger { background: rgba(239,68,68,0.18); border-color: var(--red); color: #fca5a5; }
    .hud-btn.danger:hover { background: var(--red); color: #fff; }

    select.lang-select {
      background: rgba(15,23,42,0.95); color: var(--accent); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 700; outline: none; cursor: pointer;
    }
    .vol-wrap { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
    #volume-slider { width: 62px; height: 4px; accent-color: var(--accent); cursor: pointer; }

    #status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(2,6,23,0.65); border: 1px solid rgba(255,255,255,0.12);
      padding: 5px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    }
    #status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }

    #call-banner {
      position: absolute; top: 68px; left: 50%; transform: translateX(-50%);
      background: rgba(16,185,129,0.2); border: 1px solid var(--green); color: #6ee7b7;
      padding: 5px 15px; border-radius: 999px; font-size: 12px; font-weight: 600; display: none; gap: 8px; z-index: 95;
    }
    #audio-prompt {
      position: absolute; top: 72px; left: 50%; transform: translateX(-50%);
      background: rgba(30,58,138,0.95); border: 1px solid var(--accent); color: #fff;
      padding: 7px 16px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; display: none; z-index: 200;
      white-space: nowrap;
    }
    #webcam-box {
      position: absolute; bottom: 96px; right: 16px; width: 190px; height: 142px;
      background: #000; border: 2px solid var(--accent); border-radius: 14px; overflow: hidden;
      display: none; flex-direction: column; z-index: 95;
    }
    #webcam-header { background: rgba(15,23,42,0.85); padding: 4px 10px; font-size: 10px; color: var(--accent); font-weight: 700; display: flex; justify-content: space-between; }
    #user-webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    #live-subtitle {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      max-width: calc(100% - 32px); max-height: 76px; overflow-y: auto;
      background: rgba(15,23,42,0.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 9px 18px;
      font-size: 14px; line-height: 1.45; text-align: center; z-index: 90; unicode-bidi: plaintext;
    }

    /* MOBILE QUICK DOCK */
    #mobile-bottom-dock {
      display: none; position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 120;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 20px; padding: 8px;
      align-items: center; gap: 6px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.65);
    }
    #mobile-bottom-dock input {
      flex: 1; min-width: 0; background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 14px;
      padding: 9px 12px; color: #fff; font-size: 13px; outline: none;
    }
    .mob-btn {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16);
      color: #e2e8f0; height: 38px; padding: 0 11px; border-radius: 14px; font-size: 13px;
      font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .mob-btn.primary { background: #0284c7; border-color: var(--accent); color: #fff; }
    .mob-btn.mic-active { background: var(--red); border-color: var(--red); color: #fff; }

    /* SIDEBAR DASHBOARD */
    .sidebar {
      background: var(--panel); border-left: 1px solid var(--border);
      display: flex; flex-direction: column; height: 100%; z-index: 150;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    #mobile-close-bar {
      display: none; justify-content: space-between; align-items: center;
      padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(2,6,23,0.85);
    }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(2,6,23,0.6); }
    .tab-btn {
      background: transparent; border: none; color: var(--muted); padding: 12px 6px;
      font-size: 12px; font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(56,189,248,0.08); }
    .tab-pane { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .tab-pane.active { display: flex; }

    .chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 88%; padding: 9px 13px; border-radius: 14px; font-size: 13px; line-height: 1.5; unicode-bidi: plaintext; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #0284c7; color: #fff; border-bottom-right-radius: 4px; }
    .msg.jarvis { align-self: flex-start; background: rgba(30,41,59,0.95); border: 1px solid rgba(56,189,248,0.2); border-bottom-left-radius: 4px; }
    .msg.system { align-self: center; font-size: 11px; color: var(--muted); background: rgba(255,255,255,0.05); }
    .msg a { color: #7dd3fc; text-decoration: underline; }

    .quick-chips { display: flex; gap: 6px; padding: 6px 12px; overflow-x: auto; border-top: 1px solid rgba(255,255,255,0.06); }
    .chip { flex: 0 0 auto; background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.25); color: #bae6fd; border-radius: 999px; padding: 4px 10px; font-size: 11px; cursor: pointer; }

    .chat-composer { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid rgba(255,255,255,0.1); background: rgba(2,6,23,0.75); align-items: center; }
    .chat-composer input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; padding: 9px 12px; color: #fff; font-size: 13px; outline: none; }
    .chat-composer input:focus { border-color: var(--accent); }
    .send-btn { background: #0284c7; color: #fff; border: none; border-radius: 12px; padding: 9px 13px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .mic-round { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); color: #e2e8f0; width: 38px; height: 38px; border-radius: 12px; cursor: pointer; font-size: 16px; }
    .mic-round.active { background: var(--red); border-color: var(--red); color: #fff; }

    .pane-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: rgba(30,41,59,0.7); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; padding: 10px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
    .card-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .mini-form { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .mini-form input { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 7px 10px; color: #fff; font-size: 12px; outline: none; }
    .small-btn { background: rgba(56,189,248,0.16); border: 1px solid var(--border); color: #7dd3fc; padding: 5px 9px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; text-decoration: none; }

    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 1fr; }
      #top-bar {
        top: 8px; left: 8px; right: 8px; transform: none; max-width: none; width: auto;
        border-radius: 14px; padding: 5px 8px; gap: 5px;
      }
      .hud-btn { font-size: 10.5px; padding: 4px 8px; }
      #status-pill { font-size: 9.5px; padding: 4px 8px; }
      #volume-slider { width: 50px; }
      #call-banner, #audio-prompt { top: 88px; }
      #live-subtitle {
        bottom: 66px; width: calc(100% - 20px); max-width: none;
        max-height: 62px; padding: 7px 12px; font-size: 12px; border-radius: 12px;
      }
      #webcam-box { width: 120px; height: 90px; bottom: 136px; right: 10px; }
      #mobile-bottom-dock { display: flex; }
      #mobile-close-bar { display: flex; }
      .sidebar {
        position: fixed; inset: 0 0 0 auto; width: 100vw; max-width: 420px;
        transform: translateX(100%); transition: transform 0.25s ease;
      }
      .sidebar.open { transform: translateX(0); }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "/face/vendor/three.module.js",
      "three/addons/loaders/GLTFLoader.js": "/face/vendor/GLTFLoader.js",
      "three/addons/controls/OrbitControls.js": "/face/vendor/OrbitControls.js",
      "@pixiv/three-vrm": "/face/vendor/three-vrm.module.js"
    }
  }
  </script>
</head>
<body>
<div class="app-shell">
  <div class="stage">
    <div id="canvas-container"></div>

    <div id="top-bar">
      <div id="status-pill"><div id="status-dot"></div><span id="status-text">IDLE</span></div>
      <button id="btn-wake" class="hud-btn">🎙️ Hi Jarvis: OFF</button>
      <button id="btn-audio-call" class="hud-btn">📞 Audio</button>
      <button id="btn-video-call" class="hud-btn">📹 Video</button>
      <button id="btn-interrupt" class="hud-btn danger">⏹ Stop</button>
      <select id="lang-mode" class="lang-select" title="Language Mode">
        <option value="auto">Lang: AUTO</option>
        <option value="en">English</option>
        <option value="ur">Urdu (اردو)</option>
        <option value="mix">Mix (Urdu+EN)</option>
      </select>
      <span class="vol-wrap">🔊<input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" title="Volume"></span>
    </div>

    <div id="audio-prompt">🔊 Tap anywhere to enable Jarvis voice</div>
    <div id="call-banner"><span id="call-type-label">CALL</span><span id="call-timer">00:00</span></div>

    <div id="webcam-box">
      <div id="webcam-header"><span>USER CAM</span><span style="color:#ef4444;">● LIVE</span></div>
      <video id="user-webcam" autoplay muted playsinline></video>
    </div>

    <div id="live-subtitle">JARVIS ready. Ask anything or tap Hi Jarvis.</div>

    <div id="mobile-bottom-dock">
      <button id="mob-mic-btn" class="mob-btn" title="Voice Note">🎙️</button>
      <input type="text" id="mob-input" placeholder="Ask JARVIS..." autocomplete="off">
      <button id="mob-send-btn" class="mob-btn primary">➤</button>
      <button id="mobile-drawer-btn" class="mob-btn" title="Chat, Tasks & Contacts">☰</button>
    </div>
  </div>

  <aside class="sidebar" id="sidebar">
    <div id="mobile-close-bar">
      <strong style="font-size:13px; color:#38bdf8;">J.A.R.V.I.S Dashboard</strong>
      <button id="mobile-close-btn" class="small-btn">✕ Avatar</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="chat">💬 Chat</button>
      <button class="tab-btn" data-tab="tasks">✅ Tasks</button>
      <button class="tab-btn" data-tab="contacts">📇 Phone</button>
      <button class="tab-btn" data-tab="memory">🧠 Life</button>
    </div>

    <div class="tab-pane active" id="tab-chat">
      <div class="chat-messages" id="chat-messages">
        <div class="msg system">J.A.R.V.I.S Enterprise Connected • Free Groq + Edge-TTS</div>
      </div>
      <div class="quick-chips">
        <button class="chip" data-prompt="What is my daily plan?">📋 Daily Plan</button>
        <button class="chip" data-prompt="Open YouTube">▶ YouTube</button>
        <button class="chip" data-prompt="Connect audio call">📞 Audio Call</button>
        <button class="chip" data-prompt="Connect video call">📹 Video Call</button>
      </div>
      <div class="chat-composer">
        <button id="mic-btn" class="mic-round" title="Voice Note / Speak">🎙️</button>
        <input type="text" id="user-input" placeholder="Message JARVIS..." autocomplete="off">
        <button id="send-btn" class="send-btn">Send ➤</button>
      </div>
    </div>

    <div class="tab-pane" id="tab-tasks">
      <div class="mini-form">
        <input type="text" id="new-task-text" placeholder="Task (e.g. Check server logs)">
        <div class="card-row">
          <input type="time" id="new-task-time" style="flex:1;">
          <select id="new-task-rec" class="lang-select">
            <option value="once">Once</option>
            <option value="daily">Daily</option>
          </select>
          <button class="small-btn" id="add-task-btn">+ Add</button>
        </div>
      </div>
      <div class="pane-body" id="tasks-list"></div>
    </div>

    <div class="tab-pane" id="tab-contacts">
      <div class="mini-form">
        <div class="card-row">
          <strong style="font-size:12px;">Import Phonebook (.vcf)</strong>
          <label class="small-btn" style="cursor:pointer;">
            📤 Import .vcf
            <input type="file" id="vcf-upload" accept=".vcf,text/vcard" style="display:none;">
          </label>
        </div>
        <input type="text" id="c-name" placeholder="Name (e.g. Zaid)">
        <div class="card-row">
          <input type="text" id="c-phone" placeholder="+92300..." style="flex:1;">
          <input type="email" id="c-email" placeholder="Email" style="flex:1;">
        </div>
        <button class="small-btn" id="save-contact-btn">+ Save Contact</button>
      </div>
      <div class="pane-body" id="contacts-list"></div>
    </div>

    <div class="tab-pane" id="tab-memory">
      <div class="pane-body" id="memory-list"></div>
    </div>
  </aside>
</div>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

  let currentVrm = null, avatarPivot = null;
  let scene, camera, renderer, clock, controls;
  let currentState = 'idle', currentSentiment = 'neutral';
  let ws = null, recognition = null, isRecognizing = false, wakeEnabled = false;
  let audioQueue = [], isPlayingAudio = false, masterVolume = 1.0;
  let mediaRecorder = null, voiceNoteChunks = [], isRecordingVoiceNote = false;
  let audioCtx = null, analyser = null, audioGainNode = null, audioSourceNode = null, isAudioInit = false;
  let mouthLevel = 0, mouthTarget = 0;
  let requestSeq = 0, latestReqId = '', activeCallType = null, callTimer = null, callStart = 0, webcamStream = null;
  let activeJarvisBubble = null, activeSubtitleText = '';

  let avatarLoaded = false, introSent = false;
  let entranceActive = false, entranceElapsed = 0, walkPhase = 0;
  const ENTRANCE_DURATION = 2.6;

  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const liveSubtitle = document.getElementById('live-subtitle');
  const chatMessages = document.getElementById('chat-messages');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const micBtn = document.getElementById('mic-btn');
  const mobInput = document.getElementById('mob-input');
  const mobSendBtn = document.getElementById('mob-send-btn');
  const mobMicBtn = document.getElementById('mob-mic-btn');
  const btnWake = document.getElementById('btn-wake');
  const btnAudioCall = document.getElementById('btn-audio-call');
  const btnVideoCall = document.getElementById('btn-video-call');
  const btnInterrupt = document.getElementById('btn-interrupt');
  const langMode = document.getElementById('lang-mode');
  const audioPrompt = document.getElementById('audio-prompt');
  const sidebar = document.getElementById('sidebar');

  const STATE_COLORS = { idle: '#10b981', listening: '#38bdf8', thinking: '#f59e0b', speaking: '#a855f7', entering: '#38bdf8' };

  function scrollDown(el) {
    requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
  }

  function setState(state, sentiment = null) {
    currentState = state;
    if (sentiment) currentSentiment = sentiment;
    const c = STATE_COLORS[state] || STATE_COLORS.idle;
    statusDot.style.backgroundColor = c;
    statusDot.style.boxShadow = `0 0 10px ${c}`;
    statusText.innerText = state.toUpperCase();
    statusText.style.color = c;
    if (currentVrm?.expressionManager) {
      const em = currentVrm.expressionManager;
      ['happy', 'joy', 'sad', 'sorrow', 'angry'].forEach(e => { try { em.setValue(e, 0); } catch {} });
      if (state === 'speaking' && (currentSentiment === 'joy' || currentSentiment === 'fun')) {
        try { em.setValue('happy', 0.35); em.setValue('joy', 0.35); } catch {}
      }
    }
  }

  function addChatBubble(role, text, actionUrl = null) {
    if (!text) return null;
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    if (actionUrl) {
      const br = document.createElement('br');
      const a = document.createElement('a');
      a.href = actionUrl;
      a.target = '_blank';
      a.textContent = 'Open Action Link ↗';
      div.appendChild(br);
      div.appendChild(a);
    }
    chatMessages.appendChild(div);
    scrollDown(chatMessages);
    return div;
  }

  function appendJarvisLine(text, isFirst = false, actionUrl = null) {
    if (!text) return;
    if (isFirst || !activeJarvisBubble) {
      activeJarvisBubble = addChatBubble('jarvis', text, actionUrl);
    } else {
      const span = document.createElement('span');
      span.textContent = ' ' + text;
      activeJarvisBubble.appendChild(span);
      if (actionUrl) {
        const br = document.createElement('br');
        const a = document.createElement('a');
        a.href = actionUrl;
        a.target = '_blank';
        a.textContent = 'Open Action Link ↗';
        activeJarvisBubble.appendChild(br);
        activeJarvisBubble.appendChild(a);
      }
      scrollDown(chatMessages);
    }
  }

  function getBone(name) { return currentVrm?.humanoid?.getNormalizedBoneNode(name) || null; }

  function applyStandingPose(time) {
    if (!currentVrm?.humanoid) return;
    const breathe = Math.sin(time * 1.5) * 0.012;
    const sway = Math.sin(time * 0.65) * 0.012;

    const spine = getBone('spine'), chest = getBone('chest'), neck = getBone('neck');
    if (spine) spine.rotation.set(breathe * 0.4, sway * 0.4, 0);
    if (chest) chest.rotation.set(breathe, 0, 0);

    const lUp = getBone('leftUpperArm'), rUp = getBone('rightUpperArm');
    const lLow = getBone('leftLowerArm'), rLow = getBone('rightLowerArm');
    const lHand = getBone('leftHand'), rHand = getBone('rightHand');
    const lLeg = getBone('leftUpperLeg'), rLeg = getBone('rightUpperLeg');
    const lShin = getBone('leftLowerLeg'), rShin = getBone('rightLowerLeg');

    let lArmX = 0.04 + breathe * 0.3, rArmX = 0.04 + breathe * 0.3;
    let lLowY = -0.14, rLowY = 0.14;

    if (isPlayingAudio) {
      const g = Math.sin(time * 3.0);
      lArmX += g * 0.06;
      rArmX -= g * 0.06;
      lLowY = -0.22 - Math.max(0, g) * 0.2;
      rLowY = 0.22 + Math.max(0, -g) * 0.2;
    }

    if (lUp) lUp.rotation.set(lArmX, 0.04, 1.28 + breathe * 0.2);
    if (rUp) rUp.rotation.set(rArmX, -0.04, -1.28 - breathe * 0.2);
    if (lLow) lLow.rotation.set(0, lLowY, 0.05);
    if (rLow) rLow.rotation.set(0, rLowY, -0.05);
    if (lHand) lHand.rotation.set(0, 0, 0.04);
    if (rHand) rHand.rotation.set(0, 0, -0.04);
    if (lLeg) lLeg.rotation.set(0.01, 0, -0.015);
    if (rLeg) rLeg.rotation.set(0.01, 0, 0.015);
    if (lShin) lShin.rotation.set(0, 0, 0);
    if (rShin) rShin.rotation.set(0, 0, 0);

    if (neck) {
      const tiltZ = currentState === 'listening' ? 0.05 : 0;
      const nodX = currentState === 'thinking' ? -0.05 : (isPlayingAudio ? Math.sin(time * 2.4) * 0.03 : breathe * 0.5);
      neck.rotation.set(nodX, Math.sin(time * 0.5) * 0.03, tiltZ);
    }
  }

  function updateCameraFraming() {
    const container = document.getElementById('canvas-container');
    const isPortrait = container.clientWidth < container.clientHeight;
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
    if (isPortrait) {
      camera.position.set(0.0, 1.30, 2.45);
      controls.target.set(0.0, 1.15, 0.0);
    } else {
      camera.position.set(0.0, 1.38, 2.05);
      controls.target.set(0.0, 1.26, 0.0);
    }
    controls.update();
  }

  function initScene() {
    const container = document.getElementById('canvas-container');
    clock = new THREE.Clock();
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(34, container.clientWidth / container.clientHeight, 0.1, 25);
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.minDistance = 0.6;
    controls.maxDistance = 4.6;
    controls.enableDamping = true;
    updateCameraFraming();

    scene.add(new THREE.AmbientLight(0xffffff, 0.95));
    const dir = new THREE.DirectionalLight(0xfff5ea, 1.3);
    dir.position.set(1, 2, 1.2);
    scene.add(dir);
    const fill = new THREE.DirectionalLight(0xdbeafe, 0.65);
    fill.position.set(-1, 1, 1);
    scene.add(fill);

    avatarPivot = new THREE.Group();
    scene.add(avatarPivot);

    window.addEventListener('resize', updateCameraFraming);

    const loader = new GLTFLoader();
    loader.register((p) => new VRMLoaderPlugin(p));
    loader.load('/face/model.vrm', (gltf) => {
      const vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      VRMUtils.rotateVRM0(vrm);

      currentVrm = vrm;
      avatarPivot.add(vrm.scene);
      avatarPivot.position.set(-2.2, 0, 0);
      avatarPivot.rotation.y = Math.PI * 0.46;
      applyStandingPose(0);
      vrm.update(0);

      avatarLoaded = true;
      entranceActive = true;
      entranceElapsed = 0;
      setState('entering');
    });
  }

  let lastBlink = 0, nextBlink = 3.0;
  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const time = clock.getElapsedTime();
    if (controls) controls.update();

    if (currentVrm && avatarPivot) {
      if (entranceActive) {
        entranceElapsed += delta;
        const p = Math.min(entranceElapsed / ENTRANCE_DURATION, 1);
        const walkP = Math.min(p / 0.76, 1);
        const easedWalk = walkP * walkP * (3 - 2 * walkP);

        avatarPivot.position.x = -2.2 + 2.2 * easedWalk;
        if (p < 0.76) {
          walkPhase += delta * 6.5;
          const stride = Math.sin(walkPhase);
          avatarPivot.position.y = Math.abs(stride) * 0.035;
          avatarPivot.rotation.y = Math.PI * 0.46;

          const lLeg = getBone('leftUpperLeg'), rLeg = getBone('rightUpperLeg');
          const lShin = getBone('leftLowerLeg'), rShin = getBone('rightLowerLeg');
          const lArm = getBone('leftUpperArm'), rArm = getBone('rightUpperArm');
          const spine = getBone('spine');
          if (spine) spine.rotation.set(0.05, 0, 0);
          if (lLeg) lLeg.rotation.set(stride * 0.35, 0, 0);
          if (rLeg) rLeg.rotation.set(-stride * 0.35, 0, 0);
          if (lShin) lShin.rotation.set(Math.max(0, -stride) * 0.4, 0, 0);
          if (rShin) rShin.rotation.set(Math.max(0, stride) * 0.4, 0, 0);
          if (lArm) lArm.rotation.set(-stride * 0.22, 0, 1.28);
          if (rArm) rArm.rotation.set(stride * 0.22, 0, -1.28);
        } else {
          const turnP = (p - 0.76) / 0.24;
          const easedTurn = turnP * turnP * (3 - 2 * turnP);
          avatarPivot.position.y = 0;
          avatarPivot.rotation.y = Math.PI * 0.46 * (1 - easedTurn);
          applyStandingPose(time);
        }

        if (p >= 1) {
          entranceActive = false;
          avatarPivot.position.set(0, 0, 0);
          avatarPivot.rotation.y = 0;
          setState('idle');
          if (ws?.readyState === WebSocket.OPEN && !introSent) {
            introSent = true;
            ws.send(JSON.stringify({ type: 'intro_greeting' }));
          }
        }
      } else {
        applyStandingPose(time);
        const em = currentVrm.expressionManager;
        if (em) {
          if (time - lastBlink > nextBlink) {
            const bp = (time - lastBlink - nextBlink) / 0.14;
            if (bp <= 1) { try { em.setValue('blink', Math.sin(bp * Math.PI)); } catch {} }
            else { try { em.setValue('blink', 0); } catch {} lastBlink = time; nextBlink = 2.4 + Math.random() * 3.2; }
          }

          if (isPlayingAudio && analyser) {
            const samples = new Uint8Array(analyser.fftSize);
            analyser.getByteTimeDomainData(samples);
            let sum = 0;
            for (let i = 0; i < samples.length; i++) {
              const n = (samples[i] - 128) / 128;
              sum += n * n;
            }
            const rms = Math.sqrt(sum / samples.length);
            mouthTarget = rms > 0.015 ? Math.min(0.25, rms * 1.85) : 0;
          } else {
            mouthTarget = 0;
          }
          const speed = mouthTarget > mouthLevel ? 0.55 : 0.35;
          mouthLevel += (mouthTarget - mouthLevel) * speed;
          try {
            em.setValue('aa', mouthLevel);
            em.setValue('oh', mouthLevel * 0.16);
          } catch {}
        }
      }
      currentVrm.update(delta);
    }
    renderer.render(scene, camera);
  }

  async function ensureAudioUnlocked() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    if (!isAudioInit) {
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.12;
      audioGainNode = audioCtx.createGain();
      audioGainNode.gain.value = masterVolume;
      analyser.connect(audioGainNode);
      audioGainNode.connect(audioCtx.destination);
      isAudioInit = true;
    }
    const ok = audioCtx.state === 'running';
    if (ok) {
      audioPrompt.style.display = 'none';
      if (audioQueue.length && !isPlayingAudio) processAudioQueue();
    }
    return ok;
  }

  function playAudioBase64(b64, text = '', isFirst = false) {
    if (!b64) return;
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    audioQueue.push({ bytes, text, isFirst });
    if (!isPlayingAudio) processAudioQueue();
  }

  async function processAudioQueue() {
    if (!audioQueue.length) {
      isPlayingAudio = false;
      if (activeCallType || wakeEnabled) {
        setState(wakeEnabled ? 'idle' : 'listening');
        setTimeout(startRecognition, 200);
      } else {
        setState('idle');
      }
      return;
    }

    if (!(await ensureAudioUnlocked())) {
      audioPrompt.style.display = 'block';
      isPlayingAudio = false;
      return;
    }

    stopRecognition();
    isPlayingAudio = true;
    setState('speaking');
    const item = audioQueue.shift();
    if (item.text) {
      activeSubtitleText = item.isFirst
        ? item.text
        : (activeSubtitleText ? activeSubtitleText + ' ' + item.text : item.text);
      liveSubtitle.innerText = activeSubtitleText;
      scrollDown(liveSubtitle);
    }

    audioCtx.decodeAudioData(item.bytes.buffer.slice(0), (buffer) => {
      audioSourceNode = audioCtx.createBufferSource();
      audioSourceNode.buffer = buffer;
      audioSourceNode.connect(analyser);
      audioSourceNode.onended = () => {
        isPlayingAudio = false;
        audioSourceNode = null;
        processAudioQueue();
      };
      audioSourceNode.start(0);
    }, () => {
      isPlayingAudio = false;
      processAudioQueue();
    });
  }

  function interruptSpeech() {
    if (audioSourceNode) { try { audioSourceNode.stop(0); } catch {} audioSourceNode = null; }
    audioQueue = [];
    isPlayingAudio = false;
    setState('listening');
    if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'interrupt' }));
    setTimeout(startRecognition, 150);
  }

  function initWebSocket() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => {
      if (avatarLoaded && !entranceActive && !introSent) {
        introSent = true;
        ws.send(JSON.stringify({ type: 'intro_greeting' }));
      }
      refreshDashboard();
    };
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);

      if (msg.type === 'reminder') {
        activeJarvisBubble = null;
        activeSubtitleText = msg.text;
        addChatBubble('jarvis', `⏰ ${msg.text}`);
        liveSubtitle.innerText = msg.text;
        scrollDown(liveSubtitle);
        if (msg.audio_base64) playAudioBase64(msg.audio_base64, msg.text, true);
        refreshDashboard();
        return;
      }
      if (msg.request_id && msg.request_id !== latestReqId) return;

      const isFirst = Boolean(msg.is_first_sentence || msg.action === 'intro' || msg.type === 'call_status');

      if (msg.text && (msg.type === 'audio_sentence' || msg.type === 'response' || msg.type === 'call_status')) {
        appendJarvisLine(msg.text, isFirst, msg.open_url || null);
        if (!msg.audio_base64) {
          activeSubtitleText = isFirst ? msg.text : (activeSubtitleText ? activeSubtitleText + ' ' + msg.text : msg.text);
          liveSubtitle.innerText = activeSubtitleText;
          scrollDown(liveSubtitle);
        }
        refreshDashboard();
      }

      if (msg.open_url) {
        try { window.open(msg.open_url, '_blank'); } catch {}
      }
      if (msg.action === 'start_video_call' && activeCallType !== 'video') startCall('video');
      else if (msg.action === 'start_audio_call' && activeCallType !== 'audio') startCall('audio');
      else if (msg.action === 'end_call' && activeCallType) endCall();

      if (msg.type === 'state') setState(msg.state, msg.sentiment);
      else if (msg.audio_base64) playAudioBase64(msg.audio_base64, msg.text || '', isFirst);
    };
    ws.onclose = () => setTimeout(initWebSocket, 2000);
  }

  function sendUserMessage(text) {
    if (!text?.trim()) return;
    ensureAudioUnlocked();
    const clean = text.trim();
    activeJarvisBubble = null;
    activeSubtitleText = '';
    addChatBubble('user', clean);
    setState('thinking');
    liveSubtitle.innerText = `Thinking: "${clean}"`;
    if (isPlayingAudio || audioQueue.length) interruptSpeech();
    latestReqId = `req-${++requestSeq}`;

    const selectedLang = langMode.value === 'auto' ? null : langMode.value;
    if (ws?.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'user_message', text: clean, language: selectedLang, request_id: latestReqId }));
    }
  }

  function startCall(type) {
    if (activeCallType === type) { endCall(); return; }
    activeCallType = type;
    callStart = Date.now();
    document.getElementById('call-banner').style.display = 'flex';
    document.getElementById('call-type-label').innerText = type === 'video' ? 'VIDEO CALL' : 'AUDIO CALL';
    clearInterval(callTimer);
    callTimer = setInterval(() => {
      const s = Math.floor((Date.now() - callStart) / 1000);
      document.getElementById('call-timer').innerText = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    }, 1000);
    btnVideoCall.classList.toggle('active', type === 'video');
    btnAudioCall.classList.toggle('active', type === 'audio');
    if (type === 'video') {
      navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(s => {
        webcamStream = s;
        document.getElementById('user-webcam').srcObject = s;
        document.getElementById('webcam-box').style.display = 'flex';
      }).catch(() => {});
    }
    if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'start_call', call_type: type }));
  }

  function endCall() {
    if (!activeCallType) return;
    activeCallType = null;
    btnAudioCall.classList.remove('active');
    btnVideoCall.classList.remove('active');
    document.getElementById('call-banner').style.display = 'none';
    clearInterval(callTimer);
    if (webcamStream) { webcamStream.getTracks().forEach(t => t.stop()); webcamStream = null; }
    document.getElementById('webcam-box').style.display = 'none';
    stopRecognition();
    if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'end_call' }));
    setState('idle');
  }

  function setMicVisual(active) {
    micBtn.classList.toggle('active', active);
    mobMicBtn.classList.toggle('mic-active', active);
  }

  function initRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = langMode.value === 'ur' ? 'ur-PK' : 'en-US';
    recognition.onstart = () => { isRecognizing = true; setMicVisual(true); };
    recognition.onresult = (e) => {
      const t = e.results[0][0].transcript.trim();
      if (!t) return;
      if (wakeEnabled && !activeCallType) {
        const wakeRegex = /(?:hi|hey|hello|ok|okay|oye)?\s*(?:jarvis|jarves|jarvas|jarvish|jervis|jar\s*vis|جاروس|جارویس)/i;
        if (wakeRegex.test(t)) {
          const cmd = t.replace(wakeRegex, '').replace(/^[,:\s]+/, '').trim();
          sendUserMessage(cmd || 'hi jarvis');
        }
        return;
      }
      sendUserMessage(t);
    };
    recognition.onerror = () => { isRecognizing = false; setMicVisual(false); };
    recognition.onend = () => {
      isRecognizing = false;
      setMicVisual(false);
      if ((activeCallType || wakeEnabled) && !isPlayingAudio) setTimeout(startRecognition, 400);
    };
  }
  function startRecognition() {
    if (isPlayingAudio) return;
    if (!recognition) initRecognition();
    if (!recognition || isRecognizing) return;
    recognition.lang = langMode.value === 'ur' ? 'ur-PK' : 'en-US';
    try { recognition.start(); } catch {}
  }
  function stopRecognition() {
    if (recognition && isRecognizing) { try { recognition.stop(); } catch {} isRecognizing = false; setMicVisual(false); }
  }

  async function toggleVoiceNote() {
    if (isPlayingAudio) { interruptSpeech(); return; }
    if (isRecordingVoiceNote) { mediaRecorder.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      voiceNoteChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size) voiceNoteChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        isRecordingVoiceNote = false;
        setMicVisual(false);
        const blob = new Blob(voiceNoteChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        const form = new FormData();
        form.append('file', blob, 'voice.webm');
        const langQ = (langMode.value === 'en' || langMode.value === 'ur') ? `?language=${langMode.value}` : '';
        const r = await fetch(`/api/voice/note${langQ}`, { method: 'POST', body: form });
        const d = await r.json();
        if (r.ok && d.text) sendUserMessage(d.text);
      };
      mediaRecorder.start();
      isRecordingVoiceNote = true;
      setMicVisual(true);
    } catch { addChatBubble('system', 'Microphone permission denied.'); }
  }

  async function refreshDashboard() {
    try {
      const res = await fetch('/api/dashboard');
      const data = await res.json();

      const tList = document.getElementById('tasks-list');
      tList.innerHTML = data.todos.length ? '' : '<div class="card">No pending tasks yet.</div>';
      data.todos.forEach(t => {
        const c = document.createElement('div');
        c.className = 'card';
        c.innerHTML = `<div class="card-row"><strong>${t.task}</strong><button class="small-btn" data-done="${t.id}">✓ Done</button></div>
          <span style="color:#94a3b8;">${t.due_time ? '⏰ ' + t.due_time + ' (' + t.recurrence + ')' : 'No time set'}</span>`;
        c.querySelector('[data-done]').onclick = async () => {
          await fetch(`/api/todos/${t.id}/complete`, { method: 'POST' });
          refreshDashboard();
        };
        tList.appendChild(c);
      });

      const cList = document.getElementById('contacts-list');
      cList.innerHTML = data.contacts.length ? '' : '<div class="card">No contacts yet. Import .vcf from your phone or add manually above.</div>';
      data.contacts.forEach(ct => {
        const c = document.createElement('div');
        c.className = 'card';
        const digits = (ct.phone || '').replace(/[^\d+]/g, '');
        c.innerHTML = `<div class="card-row"><strong>${ct.display_name}</strong><span>${ct.phone || ct.email || ''}</span></div>
          <div class="card-row" style="justify-content:flex-start;">
            ${digits ? `<a class="small-btn" href="tel:${digits}">📞 SIM Call</a>` : ''}
            ${digits ? `<a class="small-btn" target="_blank" href="https://wa.me/${digits.replace('+','')}">💬 WhatsApp</a>` : ''}
            ${ct.email ? `<a class="small-btn" href="mailto:${ct.email}">✉️ Email</a>` : ''}
          </div>`;
        cList.appendChild(c);
      });

      const mList = document.getElementById('memory-list');
      mList.innerHTML = '';
      data.skills.forEach(s => {
        const c = document.createElement('div');
        c.className = 'card';
        c.innerHTML = `<strong>⚡ Skill: ${s.name}</strong><span>Trigger: "${s.trigger_phrase}"</span><span style="color:#94a3b8;">${s.instructions}</span>`;
        mList.appendChild(c);
      });
      data.memories.forEach(m => {
        const c = document.createElement('div');
        c.className = 'card';
        c.innerHTML = `<strong>📌 ${m.key}</strong><span>${m.value}</span>`;
        mList.appendChild(c);
      });
      if (!data.skills.length && !data.memories.length) {
        mList.innerHTML = '<div class="card">Tell Jarvis to remember facts or learn new skills!</div>';
      }
    } catch {}
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      refreshDashboard();
    };
  });
  document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => sendUserMessage(ch.dataset.prompt));
  document.getElementById('mobile-drawer-btn').onclick = () => sidebar.classList.add('open');
  document.getElementById('mobile-close-btn').onclick = () => sidebar.classList.remove('open');

  sendBtn.onclick = () => { if (userInput.value.trim()) { sendUserMessage(userInput.value); userInput.value = ''; } };
  userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && userInput.value.trim()) { sendUserMessage(userInput.value); userInput.value = ''; } });

  mobSendBtn.onclick = () => { if (mobInput.value.trim()) { sendUserMessage(mobInput.value); mobInput.value = ''; } };
  mobInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && mobInput.value.trim()) { sendUserMessage(mobInput.value); mobInput.value = ''; } });

  micBtn.onclick = toggleVoiceNote;
  mobMicBtn.onclick = toggleVoiceNote;

  btnWake.onclick = () => {
    wakeEnabled = !wakeEnabled;
    btnWake.classList.toggle('active', wakeEnabled);
    btnWake.innerText = `🎙️ Hi Jarvis: ${wakeEnabled ? 'ON' : 'OFF'}`;
    ensureAudioUnlocked();
    if (wakeEnabled) startRecognition(); else stopRecognition();
  };
  btnAudioCall.onclick = () => startCall('audio');
  btnVideoCall.onclick = () => startCall('video');
  btnInterrupt.onclick = interruptSpeech;
  document.getElementById('volume-slider').oninput = (e) => {
    masterVolume = parseFloat(e.target.value);
    if (audioGainNode) audioGainNode.gain.value = masterVolume;
  };

  document.getElementById('add-task-btn').onclick = async () => {
    const task = document.getElementById('new-task-text').value.trim();
    if (!task) return;
    await fetch('/api/todos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        task,
        due_time: document.getElementById('new-task-time').value || null,
        recurrence: document.getElementById('new-task-rec').value
      })
    });
    document.getElementById('new-task-text').value = '';
    refreshDashboard();
  };

  document.getElementById('save-contact-btn').onclick = async () => {
    const name = document.getElementById('c-name').value.trim();
    if (!name) return;
    await fetch('/api/contacts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        phone: document.getElementById('c-phone').value.trim(),
        email: document.getElementById('c-email').value.trim()
      })
    });
    document.getElementById('c-name').value = '';
    document.getElementById('c-phone').value = '';
    document.getElementById('c-email').value = '';
    refreshDashboard();
  };

  document.getElementById('vcf-upload').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const form = new FormData();
    form.append('file', file);
    const r = await fetch('/api/contacts/import', { method: 'POST', body: form });
    const d = await r.json();
    addChatBubble('system', d.message || 'Contacts imported.');
    refreshDashboard();
  };

  window.addEventListener('pointerdown', () => ensureAudioUnlocked(), { once: true });
  initScene();
  initRecognition();
  initWebSocket();
  animate();
  // Auto-enable "Hi Jarvis" listening when opened with ?wake=1 (or from Assistant shortcut)
  if (new URLSearchParams(location.search).get('wake') === '1') {
    wakeEnabled = true;
    btnWake.classList.add('active');
    btnWake.innerText = '🎙️ Hi Jarvis: ON';
    setTimeout(() => {
      ensureAudioUnlocked();
      startRecognition();
    }, 600);
  }
</script>
